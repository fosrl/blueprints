services:
  pangolin-site:
    image: ${SITE_IMAGE:-fosrl/pangolin-cli:latest}
    container_name: ${SITE_CONTAINER_NAME:-pangolin-site}
    restart: unless-stopped
    expose:
      - "${SITE_ADMIN_PORT:-2112}"
    volumes:
      - ${HOST_CONTAINER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    environment:
      - PANGOLIN_ENDPOINT=${PANGOLIN_ENDPOINT}
      - SITE_ID=${SITE_ID}
      - SITE_SECRET=${SITE_SECRET}
      - DOCKER_SOCKET=/var/run/docker.sock
      - SITE_METRICS_PROMETHEUS_ENABLED=${SITE_METRICS_PROMETHEUS_ENABLED:-true}
      - SITE_ADMIN_ADDR=${SITE_ADMIN_ADDR:-:2112}
    networks:
      - pangolin

networks:
  pangolin:
    name: ${PANGOLIN_DOCKER_NETWORK:-pangolin_default}
